name: canonical-integrity
on:
  push:
    branches: ["release/**"]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; resolved 2026-09-18
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Verify canonical release candidate
        if: github.event_name != 'release'
        run: bash scripts/verify-canonical-release.sh
      - name: Verify published WBS and Gantt assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#docs-}"
          bash scripts/verify-wbs-gantt-distribution.sh "${release_version}" --published